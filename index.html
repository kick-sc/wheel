<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortuna · Колесо фортуны</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg1:#21170b; --bg2:#0a0907;
    --gold:#f2c35b; --gold2:#c8922e; --ivory:#fbf3df;
    --emerald:#0f6a52; --ruby:#c8243b;
    --muted:#b9aa88;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(110% 55% at 50% 0%,rgba(242,195,91,.16) 0%,transparent 60%),
      radial-gradient(120% 70% at 50% 100%,rgba(15,106,82,.18) 0%,transparent 60%),
      linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%) fixed;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:calc(max(12px,env(safe-area-inset-top)) + 50px) 16px max(28px,env(safe-area-inset-bottom));
    text-align:center;overflow-x:hidden;position:relative
  }
  /* золотая пыль на фоне */
  .star{position:fixed;width:4px;height:4px;border-radius:50%;background:#f3d28a;opacity:0;
        box-shadow:0 0 8px rgba(243,210,138,.9);animation:tw 3.2s ease-in-out infinite;pointer-events:none;z-index:0}
  @keyframes tw{0%,100%{opacity:.05;transform:translateY(0) scale(.6)}50%{opacity:.85;transform:translateY(-8px) scale(1.2)}}

  .tgico{position:absolute;z-index:6;top:max(12px,env(safe-area-inset-top));right:14px;height:40px;padding:0 14px 0 10px;
         border-radius:12px;display:flex;align-items:center;gap:8px;text-decoration:none;
         color:#f6d37a;font-size:14px;font-weight:700;letter-spacing:.3px;white-space:nowrap;
         background:linear-gradient(180deg,#2a2113 0%,#120d06 100%);
         border:1.5px solid var(--gold);box-shadow:0 4px 16px rgba(242,195,91,.30)}
  .tgico svg{width:20px;height:20px;flex:none}
  .tgico:active{transform:scale(.96)}

  h1{position:relative;z-index:1;font-family:Georgia,"Times New Roman","Playfair Display",serif;
     font-size:clamp(24px,7.4vw,34px);font-weight:700;letter-spacing:3px;line-height:1.1;text-transform:uppercase;
     background:linear-gradient(180deg,#fff6d8 0%,#f2c35b 48%,#b5791c 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 3px 14px rgba(242,195,91,.4))}
  .orn{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin:8px 0 6px;color:var(--gold);font-size:12px}
  .orn::before,.orn::after{content:"";width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn::after{transform:scaleX(-1)}
  .sub{position:relative;z-index:1;color:var(--muted);margin:0 0 26px;font-size:15px;letter-spacing:.3px}

  .stage{position:relative;z-index:1;width:min(88vw,420px);aspect-ratio:1;margin-top:10px}
  .stage::before{ /* мягкое золотое свечение за колесом */
    content:"";position:absolute;inset:-8%;border-radius:50%;
    background:radial-gradient(circle,rgba(242,195,91,.42) 0%,rgba(242,195,91,.12) 45%,transparent 70%);
    animation:glow 3.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.7;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
  canvas#c{position:absolute;left:-5.555%;top:-5.555%;width:111.11%;height:111.11%;display:block}

  .hub{position:absolute;left:50%;top:50%;width:19%;height:19%;transform:translate(-50%,-50%);
       border-radius:50%;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(circle at 35% 28%,#fff3c4 0%,#e8b64f 45%,#8f5c12 100%);
       border:3px solid #fff1c2;
       box-shadow:0 6px 20px rgba(0,0,0,.65),inset 0 -6px 12px rgba(90,50,5,.5),0 0 26px rgba(242,195,91,.65);
       font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(24px,8vw,36px);color:#3a2406;
       text-shadow:0 1px 0 rgba(255,255,255,.55)}
  /* указатель сверху, смотрит вниз */
  .pointer{position:absolute;left:50%;top:-7.5%;width:11%;transform:translateX(-50%);transform-origin:50% 22%;
           filter:drop-shadow(0 5px 8px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(242,195,91,.6))}
  .pointer svg{display:block;width:100%;height:auto}
  .pointer.tick{animation:tick .14s ease-out}
  @keyframes tick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(15deg)}100%{transform:translateX(-50%) rotate(0)}}

  .row{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;width:100%;max-width:430px;margin-top:28px}
  button{
    position:relative;border:0;border-radius:16px;padding:18px 12px;font-size:19px;font-weight:800;letter-spacing:.3px;
    font-family:inherit;cursor:pointer;color:#2a1a05;
    background:linear-gradient(180deg,#ffe9a6 0%,#f2c35b 45%,#c8922e 100%);
    box-shadow:0 8px 22px rgba(200,146,46,.45),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(120,70,5,.35);
    transition:transform .12s ease,filter .12s ease,opacity .2s
  }
  button:active:not(:disabled){transform:scale(.97);filter:brightness(1.06)}
  button:disabled{opacity:.45;box-shadow:none}
  #free{display:none;font-size:17px;color:var(--ivory);
        background:linear-gradient(180deg,#14805f 0%,#0a4a38 100%);
        border:1.5px solid rgba(242,195,91,.75);
        box-shadow:0 8px 22px rgba(15,106,82,.4),inset 0 1px 0 rgba(255,255,255,.25)}
  #check{display:none;font-size:17px;color:var(--gold);background:rgba(242,195,91,.08);
         border:1.5px solid var(--gold);box-shadow:none}
  #close{display:none;width:100%;max-width:430px;margin-top:12px;position:relative;z-index:1;
         color:var(--ivory);background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.14)}
  #spin:not(:disabled){animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(200,146,46,.45),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(120,70,5,.35)}
                   50%{box-shadow:0 8px 34px rgba(242,195,91,.9),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(120,70,5,.35)}}

  #result{position:relative;z-index:1;margin-top:18px;min-height:0}
  .res{display:inline-flex;align-items:center;gap:12px;padding:12px 20px;border-radius:16px;font-size:20px;font-weight:800;
       background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .res .big{font-size:40px;line-height:1}
  .res .bigimg{width:54px;height:54px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,241,194,.9)}
  .res .bigimg.alpha{border:0;border-radius:0;object-fit:contain;width:64px;height:64px;filter:drop-shadow(0 0 10px rgba(255,200,80,.8))}
  .res.win{background:linear-gradient(135deg,rgba(242,195,91,.26),rgba(200,36,59,.14));
           border-color:rgba(242,195,91,.85);box-shadow:0 0 30px rgba(242,195,91,.35)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  #note{position:relative;z-index:1;color:var(--muted);margin-top:12px;font-size:15px;min-height:20px;max-width:430px}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .legal{position:relative;z-index:1;margin-top:26px;color:var(--muted);font-size:13px}
  .legal a{color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(242,195,91,.3)}
  @media (prefers-reduced-motion:reduce){
    .star,.stage::before,#spin:not(:disabled){animation:none}
  }
</style>
</head>
<body>
<a class="tgico" id="tgico" href="https://t.me/FortunaChannelL" aria-label="Официальный канал" title="Официальный канал">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#37aee2" d="M9.6 15.6l-.4 4.2c.6 0 .9-.3 1.2-.6l2.9-2.7 6 4.4c1.1.6 1.9.3 2.2-1L23.9 3.9c.4-1.6-.6-2.3-1.7-1.9L1.5 9.9C-.1 10.5-.1 11.4 1.2 11.8l5.3 1.7L18.8 5.7c.6-.4 1.1-.2.7.2z"/></svg>
  <span>Наш канал</span>
</a>
<h1>Колесо фортуны</h1>
<div class="orn">◆ ◆ ◆</div>
<div class="sub">Испытай удачу и забери подарок</div>

<div class="stage">
  <canvas id="c" width="1200" height="1200"></canvas>
  <div class="hub">F</div>
  <div class="pointer" id="pointer">
    <svg viewBox="0 0 80 110" aria-hidden="true">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".5" stop-color="#e8b64f"/><stop offset="1" stop-color="#8f5c12"/></linearGradient>
        <radialGradient id="rg" cx=".35" cy=".3"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#8a1226"/></radialGradient>
      </defs>
      <path d="M40 108 L9 55 Q-1 32 13 15 Q40 -7 67 15 Q81 32 71 55 Z" fill="url(#pg)" stroke="#fff1c2" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="40" cy="36" r="13" fill="url(#rg)" stroke="#fff1c2" stroke-width="2"/>
      <circle cx="35" cy="31" r="3.5" fill="rgba(255,255,255,.75)"/>
    </svg>
  </div>
</div>

<div class="row">
  <button id="spin">Крутить</button>
  <button id="free">Бесплатный прокрут</button>
  <button id="check">Я подписался, проверить</button>
</div>
<div id="result"></div>
<div id="note"></div>
<button id="close">Закрыть</button>
<div class="legal"><a href="terms.html" data-l>Условия</a> · <a href="privacy.html" data-l>Конфиденциальность</a> · 18+</div>
<canvas id="fx"></canvas>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
try{ tg?.setHeaderColor?.('#0a0907'); tg?.setBackgroundColor?.('#0a0907'); }catch(e){}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- параметры из ссылки (их ставит бот) ----
// Режим «результат»:  ?r=<приз>&s=<id>     — кнопка «Крутить» запускает анимацию
// Режим «магазин»:    ?free=1|0&inv=<ссылка на оплату>&p=<цена>&ch=<ссылка на канал>
const q = new URLSearchParams(location.search);
const result = q.get('r'), spinId = q.get('s');
const freeFlag = q.get('free');                              // '1' доступен, '0' на паузе
const freeUntil = parseInt(q.get('fu')||'0',10);           // unix-время (сек), когда снова доступен
const isSub = q.get('sub') === '1';                        // бот уже подтверждал подписку
const invoice = q.get('inv'), channel = q.get('ch');
const price = q.get('p') || '5';

const btn = document.getElementById('spin'), freeBtn = document.getElementById('free');
const note = document.getElementById('note'), resEl = document.getElementById('result');
const pointer = document.getElementById('pointer');
// иконка Telegram: открывает официальный канал бота
document.getElementById('tgico').addEventListener('click',(e)=>{
  e.preventDefault(); const u='https://t.me/FortunaChannelL';
  if(tg?.openTelegramLink) tg.openTelegramLink(u); else window.open(u,'_blank');
});
const store = {
  get:(k)=>{ try{return localStorage.getItem(k);}catch(e){return null;} },
  set:(k,v)=>{ try{localStorage.setItem(k,v);}catch(e){} }
};

// юридические страницы открываем поверх приложения, чтобы не терять состояние колеса
document.querySelectorAll('a[data-l]').forEach(a=>a.addEventListener('click',e=>{
  const u=new URL(a.getAttribute('href'),location.href).href;
  if(tg?.openLink){ e.preventDefault(); tg.openLink(u); }
}));

// ---- звёзды на фоне ----
if(!reduceMotion){
  for(let i=0;i<26;i++){
    const s=document.createElement('span'); s.className='star';
    s.style.left=Math.random()*100+'vw'; s.style.top=Math.random()*100+'vh';
    const z=2+Math.random()*3; s.style.width=s.style.height=z+'px';
    s.style.animationDelay=(Math.random()*3.2)+'s'; s.style.animationDuration=(2.4+Math.random()*2.6)+'s';
    document.body.appendChild(s);
  }
}

// ================= КОЛЕСО =================
const SECTORS = [
  {k:'nft',    e:'💎', a:'#fff0b8', b:'#e0a43a', img:'nft.png'},   // фото NFT-подарка: файл nft.png рядом с index.html
  {k:'empty'},
  {k:'bear',   e:'🧸', a:'#fffaf0', b:'#ecd9a6'},
  {k:'empty'},
  {k:'heart',  e:'💝', a:'#fffaf0', b:'#ecd9a6'},
  {k:'empty'},
  {k:'rose',   e:'🌹', a:'#fffaf0', b:'#ecd9a6'},
  {k:'empty'},
  {k:'rocket', e:'🚀', a:'#f0556d', b:'#8a1226'},
  {k:'empty'},
];
const NAMES = {nft:'NFT-гифт', bear:'Мишка', heart:'Сердечко', rose:'Роза', rocket:'Ракета'};
const LABELS = {nft:'NFT', bear:'Мишка', heart:'Сердечко', rose:'Роза', rocket:'Ракета'};   // короткие подписи на колесе
const EMOJI = {nft:'💎', bear:'🧸', heart:'💝', rose:'🌹', rocket:'🚀'};
const N = SECTORS.length, ARC = 2*Math.PI/N, TAU = 2*Math.PI;
// загрузка фото призов (если файла нет, остаётся эмодзи)
const IMG = {};
const IMG_ALPHA = {};   // true, если у картинки прозрачный фон
SECTORS.forEach(s=>{ if(s.img){ const im=new Image(); im.onload=()=>{
    try{ const t=document.createElement('canvas'); t.width=t.height=8; const x=t.getContext('2d');
         x.drawImage(im,0,0,8,8); IMG_ALPHA[s.k] = x.getImageData(0,0,1,1).data[3] < 200; }catch(e){}
    IMG[s.k]=im; buildBody(); };
  im.onerror=()=>{}; im.src=s.img; } });
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = cv.width, C = S/2, R = 540, RB = R-62;
const POINTER = -Math.PI/2;                               // указатель сверху          // RB — радиус самого колеса (внутри ободка)
let angle = 0, spinning = false, winIndex = -1;

// тело колеса рисуем один раз в «кэш», потом только вращаем
const body = document.createElement('canvas'); body.width = body.height = S;
function buildBody(){
  const b = body.getContext('2d');
  b.clearRect(0,0,S,S); b.save(); b.translate(C,C);
  SECTORS.forEach((p,i)=>{
    b.beginPath(); b.moveTo(0,0); b.arc(0,0,RB,i*ARC,(i+1)*ARC); b.closePath();
    const g = b.createRadialGradient(0,0,RB*.12,0,0,RB);
    if(p.k==='empty'){ const alt=(i%4===1); g.addColorStop(0, alt?'#12795d':'#0f6a52'); g.addColorStop(1, alt?'#073b2e':'#06301f'); }
    else { g.addColorStop(0,p.a); g.addColorStop(1,p.b); }
    b.fillStyle = g; b.fill();
    b.lineWidth = 3; b.strokeStyle = 'rgba(242,195,91,.75)'; b.stroke();

    b.save(); b.rotate(i*ARC+ARC/2); b.textBaseline='middle';
    // общая функция «таблетки» с названием, прижатой к внешнему краю сектора
    const pill=(label,fs,bg,fg,border)=>{
      b.font='800 '+fs+'px system-ui,sans-serif'; b.textAlign='right';
      const tw=b.measureText(label).width, px=RB-40, h=fs+22, w=tw+38, x=px-w+14;
      b.shadowColor='rgba(20,10,0,.55)'; b.shadowBlur=14; b.shadowOffsetY=4;
      b.fillStyle=bg; b.beginPath(); b.roundRect(x,-h/2,w,h,14); b.fill();
      b.shadowColor='transparent';
      if(border){ b.lineWidth=3; b.strokeStyle=border; b.stroke(); }
      b.fillStyle=fg; b.fillText(label,px-5,3);
    };
    if(p.k==='empty'){
      // «гравировка» золотом, без плашки
      b.font='700 42px Georgia,"Times New Roman",serif'; b.textAlign='right';
      try{ b.letterSpacing='5px'; }catch(e){}
      b.shadowColor='rgba(0,0,0,.6)'; b.shadowBlur=8; b.shadowOffsetY=3;
      b.fillStyle='#f2c35b'; b.fillText('ПУСТО',RB-46,3);
      try{ b.letterSpacing='0px'; }catch(e){}
    } else {
      // название приза в тёмной золотой плашке рядом с картинкой, например «Мишка 🧸»
      pill(LABELS[p.k], 34, '#1a120a', '#f6d37a', '#d9a441');
      if(IMG[p.k]){
        const im=IMG[p.k], sz=IMG_ALPHA[p.k] ? 190 : 150, x=225-sz/2, y=-sz/2;
        if(IMG_ALPHA[p.k]){
          // прозрачный PNG: рисуем сам предмет, без рамки, с мягким свечением
          const k=Math.min(sz/im.width,sz/im.height), w=im.width*k, hh=im.height*k;
          b.shadowColor='rgba(255,190,60,.85)'; b.shadowBlur=26; b.shadowOffsetY=0;
          b.drawImage(im,x+(sz-w)/2,y+(sz-hh)/2,w,hh);
          b.shadowColor='rgba(30,15,0,.5)'; b.shadowBlur=14; b.shadowOffsetY=8;
          b.drawImage(im,x+(sz-w)/2,y+(sz-hh)/2,w,hh);
        } else {
          b.shadowColor='rgba(30,15,0,.5)'; b.shadowBlur=22; b.shadowOffsetY=6;
          b.fillStyle='rgba(255,255,255,.9)'; b.beginPath(); b.roundRect(x,y,sz,sz,30); b.fill();
          b.shadowColor='transparent';
          b.save(); b.beginPath(); b.roundRect(x,y,sz,sz,30); b.clip();
          const k=Math.max(sz/im.width,sz/im.height), w=im.width*k, hh=im.height*k;
          b.drawImage(im,x+(sz-w)/2,y+(sz-hh)/2,w,hh); b.restore();
          b.lineWidth=5; b.strokeStyle='rgba(255,255,255,.95)'; b.beginPath(); b.roundRect(x,y,sz,sz,30); b.stroke();
        }
      } else {
        b.font='86px '+EMOJI_FONT; b.textAlign='center';
        b.shadowColor='rgba(30,15,0,.45)'; b.shadowBlur=16; b.shadowOffsetY=5;
        b.fillText(p.e, 182, 6);
      }
    }
    b.restore();
  });
  b.restore();
}

// внешний ободок со «лампочками»
function drawRim(t){
  ctx.save(); ctx.translate(C,C);
  // основа ободка
  const g = ctx.createLinearGradient(-R,-R,R,R);
  g.addColorStop(0,'#fff3c4'); g.addColorStop(.35,'#e8b64f'); g.addColorStop(.7,'#9a6414'); g.addColorStop(1,'#f0c864');
  ctx.shadowColor='rgba(255,190,70,.7)'; ctx.shadowBlur=36;
  ctx.beginPath(); ctx.arc(0,0,R-10,0,TAU); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  // внутренняя тёмная кромка и тонкий золотой кант
  ctx.beginPath(); ctx.arc(0,0,RB+8,0,TAU); ctx.fillStyle='#1d1206'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,RB+3,0,TAU); ctx.lineWidth=5; ctx.strokeStyle='#e8bb55'; ctx.stroke();
  // лампочки
  const L=20;
  for(let i=0;i<L;i++){
    const a=i/L*TAU, x=Math.cos(a)*(R-36), y=Math.sin(a)*(R-36);
    const on = reduceMotion ? 1 : (Math.sin(t/260 + (spinning? i*.9 : i*.5)) > -.2 ? 1 : .25);
    ctx.beginPath(); ctx.arc(x,y,9,0,TAU);
    ctx.fillStyle = (i%2? '#fff6d6':'#ffe08a');
    ctx.globalAlpha = .35 + .65*on;
    ctx.shadowColor='#ffd479'; ctx.shadowBlur = 18*on; ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.restore();
}

function drawWinGlow(t){
  if(winIndex<0) return;
  const pulse = .55 + .45*Math.sin(t/180);
  ctx.save(); ctx.translate(C,C); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,RB-2,winIndex*ARC,(winIndex+1)*ARC); ctx.closePath();
  ctx.shadowColor='#ffd479'; ctx.shadowBlur=36*pulse;
  ctx.lineWidth=9; ctx.strokeStyle='rgba(255,224,140,'+(.65+.35*pulse)+')'; ctx.stroke();
  ctx.restore();
}

function draw(t=0){
  ctx.clearRect(0,0,S,S);
  drawRim(t);
  ctx.save(); ctx.translate(C,C); ctx.rotate(angle); ctx.drawImage(body,-C,-C); ctx.restore();
  // лёгкий блик сверху
  ctx.save(); ctx.translate(C,C);
  const hl = ctx.createLinearGradient(0,-RB,0,RB);
  hl.addColorStop(0,'rgba(255,255,255,.16)'); hl.addColorStop(.5,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(0,0,RB,0,TAU); ctx.fillStyle=hl; ctx.fill(); ctx.restore();
  drawWinGlow(t);
}
buildBody();
(function loop(t){ draw(t); requestAnimationFrame(loop); })(0);

// какой сектор сейчас под указателем (сверху)
const sectorAt = (a)=> Math.floor((((POINTER-a)%TAU)+TAU)%TAU / ARC) % N;

// ================= КОНФЕТТИ =================
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
let parts = [], fxRun = false;
function sizeFx(){ const d=Math.min(devicePixelRatio||1,2); fx.width=innerWidth*d; fx.height=innerHeight*d; fctx.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize',sizeFx);
function confetti(){
  if(reduceMotion) return;
  const cols=['#f2c35b','#fff3c8','#e0405a','#18a077','#ffffff','#e6a93a'];
  const cx=innerWidth/2, cy=innerHeight*.42;
  for(let i=0;i<130;i++){
    const a=Math.random()*TAU, v=5+Math.random()*9;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,g:.22+Math.random()*.12,
      w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*TAU,vr:(Math.random()-.5)*.5,
      c:cols[i%cols.length],life:1});
  }
  if(!fxRun){ fxRun=true; requestAnimationFrame(stepFx); }
}
function stepFx(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=p.g; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.009;
    fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.globalAlpha=Math.max(p.life,0);
    fctx.fillStyle=p.c; fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); fctx.restore(); });
  parts = parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  if(parts.length) requestAnimationFrame(stepFx); else { fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight); }
}

// Когда колесо прокручено, сообщаем боту: он объявит приз в чате (и только после этого)
let doneSent = false;
function sendDone(){
  if(doneSent) return; doneSent = true;
  if(tg?.sendData && spinId) tg.sendData(JSON.stringify({a:'done', s:parseInt(spinId,10)}));   // окно закроется
  else tg?.close();
}
function showClose(){
  const c = document.getElementById('close'); c.textContent='Готово'; c.style.display='block'; c.onclick=sendDone;
}
function showResult(key){
  const win = NAMES[key];
  resEl.innerHTML = win
    ? `<div class="res win">${IMG[key] ? `<img class="bigimg${IMG_ALPHA[key]?' alpha':''}" src="${SECTORS.find(s=>s.k===key).img}" alt="">` : `<span class="big">${EMOJI[key]}</span>`}<span>Ты выиграл: ${win}!</span></div>`
    : `<div class="res"><span class="big">😔</span><span>Не повезло, попробуй ещё</span></div>`;
}

// ================= РЕЖИМ «РЕЗУЛЬТАТ»: бот выдал прокрут =================
if(result && spinId){
  freeBtn.style.display = 'none';
  btn.textContent = 'Крутить';
  if(store.get('spin_'+spinId)==='1'){
    btn.disabled = true;
    note.textContent = 'Этот прокрут уже использован. Нажми «Готово», и бот объявит результат в чате.';
    showClose();
  }
  btn.onclick = ()=>{
    if(spinning || btn.disabled) return;
    spinning = true; btn.disabled = true; store.set('spin_'+spinId,'1');
    const idx = SECTORS.map((s,i)=>s.k===result?i:-1).filter(i=>i>=0);
    const i = idx.length ? idx[Math.floor(Math.random()*idx.length)] : 1;
    // чуть смещаем остановку внутри сектора, чтобы выглядело естественно
    const jitter = (Math.random()-.5)*ARC*.5;
    const target = TAU*7 + ((((POINTER - (i*ARC+ARC/2)) % TAU) + TAU) % TAU) + jitter;
    const start = angle % TAU, dur = reduceMotion ? 900 : 5600, t0 = performance.now();
    let lastSec = sectorAt(angle), lastBuzz = 0;
    (function f(now){
      const k = Math.min(1,(now-t0)/dur), ease = 1-Math.pow(1-k,4);
      angle = start + (target-start)*ease;
      const sec = sectorAt(angle);
      if(sec!==lastSec){            // указатель прошёл границу сектора: щелчок
        lastSec = sec;
        pointer.classList.remove('tick'); void pointer.offsetWidth; pointer.classList.add('tick');
        if(now-lastBuzz>70){ tg?.HapticFeedback?.impactOccurred('light'); lastBuzz=now; }
      }
      if(k<1) return requestAnimationFrame(f);
      spinning=false; winIndex = result==='empty' ? -1 : i;
      const win = NAMES[result];
      tg?.HapticFeedback?.notificationOccurred(win?'success':'warning');
      showResult(result);
      if(win) confetti();
      note.textContent = win ? 'Админ скоро свяжется с тобой и отправит подарок.' : '';
      showClose();
      setTimeout(sendDone, 6500);     // через несколько секунд сам вернёмся в чат, где бот объявит приз
    })(t0);
  };

// ================= РЕЖИМ «МАГАЗИН»: платный или бесплатный прокрут =================
} else {
  btn.textContent = `Крутить за ${price} ⭐`;
  freeBtn.style.display = 'block';

  // бесплатный прокрут раз в 12 часов: пока не прошло время, кнопка показывает таймер
  const pad = (n)=>String(n).padStart(2,'0');
  function refreshFree(){
    const left = freeUntil - Math.floor(Date.now()/1000);
    if(freeFlag==='0' && left>0){
      freeBtn.disabled = true;
      freeBtn.textContent = `Бесплатный через ${pad(Math.floor(left/3600))}:${pad(Math.floor(left%3600/60))}:${pad(left%60)}`;
      if(!note.textContent) note.textContent = 'Бесплатный прокрут можно брать раз в 12 часов.';
    } else {
      freeBtn.disabled = false; freeBtn.textContent = 'Бесплатный прокрут';
    }
  }
  refreshFree(); setInterval(refreshFree,1000);

  // Платный прокрут: окно оплаты звёздами, потом бот пришлёт результат в чат
  btn.onclick = ()=>{
    if(!invoice){ note.textContent = 'Нет ссылки на оплату. Открой колесо через бота (/start).'; return; }
    if(!tg?.openInvoice){ note.textContent = 'Открой колесо внутри Telegram.'; return; }
    tg.openInvoice(invoice, (status)=>{
      if(status === 'paid'){
        note.textContent = 'Оплачено! Возвращаюсь в чат, там будет твой прокрут.';
        setTimeout(()=>tg.close(), 1200);
      } else if(status === 'cancelled'){ note.textContent = 'Оплата отменена.'; }
      else if(status === 'failed'){ note.textContent = 'Не получилось оплатить, попробуй ещё раз.'; }
    });
  };

  // Бесплатный прокрут: в первый раз ведёт в канал, потом появляется «Я подписался, проверить»
  const checkBtn = document.getElementById('check');
  freeBtn.onclick = ()=>{
    if(freeBtn.disabled) return;
    if(isSub){ tg?.sendData(JSON.stringify({a:'free'})); return; }   // уже подписан: бот просто перепроверит
    note.textContent = 'Подпишитесь на канал для бесплатного прокрута';
    checkBtn.style.display = 'block';
    if(channel){ tg?.openTelegramLink ? tg.openTelegramLink(channel) : window.open(channel,'_blank'); }
  };
  checkBtn.onclick = ()=>{
    tg?.sendData(JSON.stringify({a:'free'}));   // бот проверит подписку, окно закроется
  };
}
</script>
